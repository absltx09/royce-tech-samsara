<!DOCTYPE html>
<html>
    <head>
        <title>Book a free screening: Royce Technologies Samsara</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="wrap">
                <a class="wordmark" href="index.html">Royce</a>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="press.html">Newsroom</a>
                    <a href="signup.html" class="current">Book a screening</a>
                </nav>
                <div class="clock">
                    Samsara 3:47 am
                </div>
            </div>
        </header>

        <main>
            <section>
                <div class="wrap">
                    <h1>Book a free screening</h1>
                    <p class="lede">Or join the waitlist for the EME Halo. Selection is discretionary.</p>
                    <!--fake form, nothing is saved-->
                    <form action="thanks.html" method="get">
                        
                        <p><strong>What would you like?</strong></p>
                        <label class="choice"><input type="radio" name="kind" value="screening" checked> A free Vesoler screening</label>
                        <label class="choice"><input type="radio" name="kind" value="halo"> A place on the EME Halo waitlist</label>
                        <br>

                        <label for="district">Your district</label>
                        <select id="district" name="district">
                            <!--placeholder names-->
                            <option>Harbour Road</option>
                            <option>Kessler Street</option>
                            <option>Eastside</option>
                            <option>Elysia Island</option>
                        </select>

                        <label for="cid">Candidate ID (optional)</label>
                        <!--you get your ID by playing INTAKE-->
                        <input type="text" id="cid" name="cid" placeholder="SC-0000-A">

                        <label class="choice"><input type="checkbox" name="consent" required> I understand this process is not a queue.</label>
                        <br>
                        <button class="btn" type="submit">Submit my interest</button>
                    </form>
                </div>

                
            </section>

        </main>

        <footer>
            <div class="wrap">
                <p>Royce Technologies Samsara. Measuring what matters since 1847.</p>
            </div>
        </footer>
    </body>
</html>
